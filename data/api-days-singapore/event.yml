  - slug: singapore-zero-to-spec
    title: 'From Zero to Spec: Here: Eliminating Lean Wastes When Adopting OpenAPI'
    description: Adopting OpenAPI can be challenging, but with the right approach, organizations can eliminate lean wastes and accelerate their API development lifecycle. This talk explores proven strategies for implementing OpenAPI in enterprise environments, focusing on eliminating unnecessary complexity and streamlining the specification process. Learn how to implement OpenAPI across teams and organizations effectively.
