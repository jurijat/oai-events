  - slug: singapore-developer-first
    title: Building Developer-First APIs
    description: Developer experience is the new competitive advantage. This talk explores how to design APIs that developers love to use, maintain, and integrate with. Learn about documentation best practices, sandbox environments, SDK generation, API versioning, and how to gather and act on developer feedback. Discover how companies like Stripe and Twilio prioritize DX in their API design.
