  - slug: singapore-sdms-openapi-ai
    title: 'Bridging SDMs, OpenAPI, and AI: Unified Schemas for AI-to-API Chaining'
    description: The convergence of AI, API management, and schema-driven development creates new opportunities for building intelligent API systems. This session explores how to bridge Service Data Models (SDMs), OpenAPI specifications, and AI technologies to create unified schemas that enable seamless AI-to-API chaining. Discover how organizations are leveraging these technologies together to build next-generation API ecosystems.
