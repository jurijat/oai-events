  - slug: singapore-api-workflow
    title: 'From REST to Events: API Workflow Testing and Modeling with a Single Arazzo Spec'
    description: Arazzo is a new specification designed to describe and model API workflows and interactions. In this talk, discover how Arazzo complements OpenAPI to provide a comprehensive view of multi-step API interactions, event-driven architectures, and complex workflows. Learn how to use a single Arazzo spec to test, validate, and document your entire API workflow.
