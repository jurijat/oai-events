      - time: '11:00'
        title: REST to Events
        permalink: /events/talks/summit-rest-to-events
    metaTitle: How the Dutch Government Uses an OpenAPI-First Approach
  - slug: summit-rest-to-events
    title: 'From REST to Events: API Workflow Testing and Mocking with a Single Arazzo Spec'
    description: Explore how Arazzo specification extends OpenAPI to describe API workflows across multiple HTTP calls. Learn practical techniques for testing complex API sequences, generating realistic mocks, and validating end-to-end scenarios.
    time: 11:00 — 11:25
    speakers:
      - name: Sarah Chen
        position: Staff Engineer / Stripe
        photo: https://images.unsplash.com/photo-1489424731084-a5d8b219a5bb?w=200&h=200&fit=crop
