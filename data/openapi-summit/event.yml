        title: APIs and AI
        permalink: /events/talks/summit-api-ai
      - time: '13:00'
        title: Security Best Practices
        permalink: /events/talks/summit-security
    metaTitle: Bridging SDKs, OpenAPI, and AI
  - slug: summit-api-ai
    title: APIs Weren't Built for AI, Now What?
    description: Most existing APIs were designed for human developers or traditional applications, not AI agents. This talk examines the gaps between current API design patterns and AI requirements, then proposes practical adaptations to make your APIs AI-ready without breaking existing clients.
    time: 10:00 — 10:25
    speakers:
      - name: Emma Watson
        position: Principal Engineer / Acme
        photo: https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&h=200&fit=crop
