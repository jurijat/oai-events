        permalink: /events/talks/summit-rest-to-events
    metaTitle: 'From REST to Events: API Workflow Testing'
  - slug: summit-sdks-ai
    title: 'Bridging SDKs, OpenAPI, and AI: Unified Schemas for AI-to-API Chaining'
    description: Learn how to bridge the gap between AI systems and your APIs using OpenAPI specifications as the universal language. This session covers techniques for generating SDKs from specs, enabling LLMs to call your APIs reliably, and creating unified schemas that work across both traditional clients and AI agents.
    time: 09:00 — 09:25
    speakers:
      - name: Michael Rodriguez
        position: Director of DX / Okta
        photo: https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&h=200&fit=crop
