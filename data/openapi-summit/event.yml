talks:
  - slug: summit-zero-to-spec
    title: 'From Zero to Spec-Hero: Eliminating Lean Wastes When Adopting OpenAPI'
    description: Adopting OpenAPI can be challenging, but with the right approach, organizations can eliminate lean wastes and accelerate their API development lifecycle. This talk explores proven strategies for implementing OpenAPI in enterprise environments, focusing on eliminating unnecessary complexity and streamlining the specification process.
    time: 09:00 — 09:25
    speakers:
      - name: Frank Kilcommins
        position: Head of Enterprise Architecture / Jentic
        photo: https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&h=200&fit=crop
    schedule:
      - time: '09:00'
        title: From Zero to Spec-Hero
        permalink: /events/talks/summit-zero-to-spec
      - time: '09:30'
        title: Dutch Government OpenAPI
        permalink: /events/talks/summit-dutch-gov
      - time: '11:00'
        title: REST to Events
        permalink: /events/talks/summit-rest-to-events
  - slug: summit-dutch-gov
    title: How the Dutch Government Uses an OpenAPI-First Approach to Leverage Developer Experience
    description: The Dutch government has pioneered an OpenAPI-first approach to building digital services that prioritizes developer experience. Learn how they've standardized API design across government agencies, improved collaboration between teams, and created a framework that encourages innovation while maintaining consistency.
    time: 09:30 — 09:55
    speakers:
      - name: Naresh Jain
        position: CEO / ConfEngine
        photo: https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop
